[project]
name = "hht-prismedu"
version = "0.1.0"
description = "HHT棱镜课堂：以 BKT 掌握度为状态中枢的三端学情闭环 Agent 系统"
requires-python = ">=3.11,<3.13"

dependencies = [
    # ---- Agent 框架层 ----
    "langchain>=1.0",                        # LLM 统一接入 / Prompt / RAG / tool 定义
    "langgraph>=1.0",                        # 三端 Agent 状态机主干（StateGraph + interrupt）
    "langgraph-checkpoint-postgres>=2.0",    # PostgresSaver：挂起会话与业务表同库
    "crewai>=0.86",                          # 教研端两套 crew（analysis_crew / exam_crew）
    # ---- 服务层 ----
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",                            # 登录失败计数（多 worker 共享）；没配 REDIS_URL 时走进程内存
    # ---- 数据层 ----
    "psycopg[binary]>=3.2",                  # PostgreSQL 16 驱动（业务表 + checkpointer 同库）
    "alembic>=1.13",                         # 迁移管理，从第一张表开始
    "neo4j>=5.26",                           # 知识点图谱
    "pymilvus>=2.4",                         # Milvus standalone 客户端
    "langchain-milvus>=0.1",                 # LangChain Milvus Retriever 集成
    # ---- 统计 ----
    #   前端是 web_app/ 里的原生 ES Modules（无构建、无 npm），
    #   不占 Python 依赖；原先的 Streamlit 演示端已于 2026-10-26 删除。
    "pandas>=2.2",
    # ---- 基础工具 ----
    "pydantic-settings>=2.4",                # .env 配置加载
    "httpx>=0.27",                           # LLM 连通性探测 / 异步 HTTP
    "sympy>=1.13",                           # M3-T1 表达式等价判分（此前靠 crewai 传递依赖，必须显式声明）
    "langchain-community>=0.4.2",
    "python-jose[cryptography]>=3.5.0",
    "bcrypt>=5.0.0",
    "dashscope>=1.27.7",
    # Agent 链路观测（自托管 Langfuse v2；keys 未配时零开销）
    #   ★ langfuse-langchain 必须显式声明：core 包 2.60.10 的集成代码只认 langchain 0.x
    #     （import langchain.callbacks.base，1.x 已删），独立集成包才有 langchain v1 分支
    #     （from langchain_core.callbacks import BaseCallbackHandler），且构造签名不变
    "langfuse>=2.60,<3",
    "langfuse-langchain>=2.60,<3",
    "sentence-transformers>=6.1.0",
    "langchain-openai>=1.7.2",
    "pypdf>=6.21.2",
    "fonttools>=4.67.0",
    "pypdfium2>=5.14.0",
    "python-multipart>=0.0.32",
    "apscheduler>=3.10,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# 纯应用项目，不做包构建：uv run 直接以项目根为工作目录执行
package = false
